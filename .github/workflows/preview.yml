name: Deploy LauncherRE browser preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "launcherre-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static preview
        run: |
          node --check preview/app.js
          test -s preview/index.html
          test -s preview/style.css
          grep -q 'href="./style.css"' preview/index.html
          grep -q 'src="./app.js"' preview/index.html
      - name: Upload static preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
